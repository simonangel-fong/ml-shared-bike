name: app-backend

# Builds the prediction image and points the function at it.
#
# The image carries the model and the prior-year lookup tables, so a build is
# the only way either changes in production.
on:
  push:
    branches: [master]
    paths:
      - "app/lambda/**"
      - ".github/workflows/app-backend.yml"
  workflow_dispatch:

concurrency:
  group: app-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  FUNCTION: toronto-shared-bike-ml-api
  MODEL_URI: s3://toronto-shared-bike-ml-ud3m7h/trains/annual-demand-q80-2026-08-04-22-00-42-965/output/model-joblib.tar.gz
  SPLIT_URI: s3://toronto-shared-bike-ml-ud3m7h/data/split/test.parquet

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # model.joblib is gitignored - it is 8MB of binary that S3 is the source
      # of truth for. The image is built around whatever is deployed there.
      - name: Fetch model
        run: |
          mkdir -p app/lambda/model
          aws s3 cp "$MODEL_URI" - | tar -xzO model.joblib > app/lambda/model/model.joblib
          ls -la app/lambda/model/

      # The handler rebuilds 15 features from (station, date, hour). If that
      # arithmetic drifts from what the model was trained on, nothing raises -
      # the prediction is simply wrong. This has already caught a weekday
      # convention mismatch, so it gates the build rather than following it.
      - name: Feature parity
        run: |
          pip install --quiet pandas pyarrow joblib scikit-learn numpy
          aws s3 cp "$SPLIT_URI" /tmp/test.parquet
          cd app/lambda && python test_features.py /tmp/test.parquet

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # oci-mediatypes=false is required, not cosmetic: lambda rejects the OCI
      # manifest that buildx writes by default, and --provenance=false alone
      # does not change it.
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="$REGISTRY/toronto-shared-bike-ml-api"
          docker buildx build --platform linux/amd64 \
            --provenance=false --sbom=false \
            --output "type=image,name=$IMAGE:$TAG,oci-mediatypes=false,push=true" \
            app/lambda/
          echo "IMAGE_URI=$IMAGE:$TAG" >> "$GITHUB_ENV"

      # Updating the function directly rather than through terraform: this
      # changes one field, and a full apply would touch the whole stack.
      - name: Update function
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --image-uri "$IMAGE_URI" \
            --publish >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION"
          echo "deployed $IMAGE_URI"

      # Green means the api answers, not that the pipeline ran.
      - name: Smoke test
        run: |
          url="https://${{ vars.DOMAIN_NAME }}/api/forecast"
          body='{"station_id":7000,"date":"2023-07-19","hour":17}'
          out=$(curl -sS -XPOST "$url" -H 'Content-Type: application/json' -d "$body")
          echo "$out"
          echo "$out" | python -c "
          import json,sys
          p = json.load(sys.stdin)['predictions'][0]
          assert isinstance(p, (int, float)), p
          print(f'ok: {p}')
          "
