name: mlops-train

on:
  push:
    branches:
      - master
    paths:
      - "mlops/**"
      - ".github/workflows/train.yml"
  workflow_dispatch:
    inputs:
      quantile:
        description: "quantile to fit"
        default: "0.8"
      dry_run:
        description: "print the plan without submitting"
        type: boolean
        default: false

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false # not cancel existing run

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # enable cache on requirements
          cache: pip
          cache-dependency-path: mlops/requirements-dev.txt

      - name: Install submit-side deps
        run: pip install -r mlops/requirements-dev.txt

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Submit training job
        run: |
          python mlops/submit.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} \
            --quantile ${{ inputs.quantile || '0.8' }} \
            --bucket ${{ vars.S3_BUCKET }} \
            --role ${{ vars.SAGEMAKER_ROLE_ARN }}
