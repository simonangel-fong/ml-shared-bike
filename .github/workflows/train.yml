name: train

# Training costs money, so the triggers are narrow.
on:
  push:
    branches: [master]
    paths:
      - "mlops/**"
      - ".github/workflows/train.yml"
  workflow_dispatch:
    inputs:
      quantile:
        description: "quantile to fit"
        default: "0.8"
      dry_run:
        description: "print the plan without submitting"
        type: boolean
        default: false

# Not cancel-in-progress: killing the runner orphans the SageMaker job rather
# than stopping it, leaving it to bill unwatched.
concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          # Default patterns are root-level and would not match this file.
          cache-dependency-path: mlops/requirements-dev.txt

      - name: Install submit-side deps
        run: pip install -r mlops/requirements-dev.txt

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Submit training job
        run: |
          python mlops/submit.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} \
            --quantile ${{ inputs.quantile || '0.8' }} \
            --bucket ${{ vars.ML_BUCKET }} \
            --role ${{ vars.SAGEMAKER_ROLE_ARN }}
