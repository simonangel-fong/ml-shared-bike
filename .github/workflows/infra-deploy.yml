name: Deploy infrastrucure

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/app-infra.yml"
  push:
    branches:
      - master
    paths:
      - "infra/**"
      - ".github/workflows/app-infra.yml"
  workflow_dispatch:

concurrency:
  group: infra-deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read
  pull-requests: write # to comment the plan

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_acm_certificate_domain: ${{ vars.ACM_CERTIFICATE_DOMAIN }}

jobs:
  terraform-infra-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Read deployed image tag
        id: tag
        run: |
          tag=$(aws lambda get-function \
            --function-name toronto-shared-bike-ml-api \
            --query 'Code.ImageUri' --output text 2>/dev/null | sed 's/.*://' || echo "")
          echo "value=${tag:-latest}" >> "$GITHUB_OUTPUT"
          echo "deployed image tag: ${tag:-latest}"

      - name: Init
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ vars.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform format check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform validate check
        run: terraform -chdir=infra validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform -chdir=infra plan -no-color -input=false \
            -var "lambda_image_tag=${{ steps.tag.outputs.value }}" \
            | tee /tmp/plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            // A large plan exceeds github's comment limit; the tail is the part
            // that says what changes.
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### terraform plan\n\`\`\`\n${plan}\n\`\`\``,
            });

      - name: Apply
        if: github.event_name != 'pull_request'
        run: |
          terraform -chdir=infra apply -auto-approve -input=false \
            -var "lambda_image_tag=${{ steps.tag.outputs.value }}"
