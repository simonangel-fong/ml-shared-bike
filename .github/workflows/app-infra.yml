name: app-infra

# Terraform owns the plumbing: ecr, lambda, api gateway, cloudfront, dns, iam.
# Plan on a pull request so the diff is reviewable; apply only on master.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/app-infra.yml"
  push:
    branches: [master]
    paths:
      - "infra/**"
      - ".github/workflows/app-infra.yml"
  workflow_dispatch:

# Two applies against one state file is how state gets corrupted. Not
# cancel-in-progress: killing terraform mid-apply leaves a lock behind.
concurrency:
  group: app-infra
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read
  pull-requests: write # to comment the plan

env:
  AWS_REGION: ca-central-1
  # Read by the cloudflare provider. terraform.tfvars is gitignored because it
  # held this token in plaintext; CI supplies it from a secret instead.
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_acm_certificate_domain: ${{ vars.ACM_CERTIFICATE_DOMAIN }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # The deployed image tag is set by app-backend, not by tfvars - reading
      # it back stops an infra apply from rolling the function to whatever tag
      # happened to be committed.
      - name: Read deployed image tag
        id: tag
        run: |
          tag=$(aws lambda get-function \
            --function-name toronto-shared-bike-ml-api \
            --query 'Code.ImageUri' --output text 2>/dev/null | sed 's/.*://' || echo "")
          echo "value=${tag:-latest}" >> "$GITHUB_OUTPUT"
          echo "deployed image tag: ${tag:-latest}"

      # backend.hcl is gitignored, so it does not exist on the runner. Its
      # contents are not secret - a bucket, a key, a region - so they are passed
      # as flags rather than committing the file or inventing a secret for it.
      - name: Init
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ vars.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - run: terraform -chdir=infra fmt -check -recursive

      - run: terraform -chdir=infra validate

      - name: Plan
        id: plan
        run: |
          terraform -chdir=infra plan -no-color -input=false \
            -var "lambda_image_tag=${{ steps.tag.outputs.value }}" \
            | tee /tmp/plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // A large plan exceeds github's comment limit; the tail is the part
            // that says what changes.
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### terraform plan\n\`\`\`\n${plan}\n\`\`\``,
            });

      - name: Apply
        if: github.event_name != 'pull_request'
        run: |
          terraform -chdir=infra apply -auto-approve -input=false \
            -var "lambda_image_tag=${{ steps.tag.outputs.value }}"
