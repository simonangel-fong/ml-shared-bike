name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "what to destroy"
        type: choice
        options: [serving, all]
        default: serving
        required: true
      confirm:
        description: "type the domain name to confirm (trip-ml.arguswatcher.net)"
        type: string
        required: true

concurrency:
  group: app-infra
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_acm_certificate_domain: ${{ vars.ACM_CERTIFICATE_DOMAIN }}

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "${{ vars.DOMAIN_NAME }}" ]; then
            echo "::error::confirmation did not match ${{ vars.DOMAIN_NAME }} - nothing was destroyed"
            exit 1
          fi
          echo "confirmed, scope=${{ inputs.scope }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: AWS Authenticate OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ vars.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Print bucket items
        if: inputs.scope == 'all'
        run: |
          bucket=$(terraform -chdir=infra output -raw s3_bucket_name)
          echo "::warning::destroying $bucket and its contents"
          aws s3 ls "s3://$bucket/" --recursive --summarize | tail -5

      - name: Destroy serving
        if: inputs.scope == 'serving'
        run: |
          terraform -chdir=infra apply -auto-approve -input=false \
            -var "enable_deployment=false"

      - name: Destroy all
        if: inputs.scope == 'all'
        run: terraform -chdir=infra destroy -auto-approve -input=false

      - name: Summary
        run: |
          echo "### destroyed: ${{ inputs.scope }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.scope }}" = "serving" ]; then
            echo "Bucket, kms key and iam roles kept. Rebuild with app-infra then app-backend." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Everything removed, including the ml bucket and its key." >> "$GITHUB_STEP_SUMMARY"
            echo "The kms key is pending deletion; artifacts are unreadable." >> "$GITHUB_STEP_SUMMARY"
          fi
