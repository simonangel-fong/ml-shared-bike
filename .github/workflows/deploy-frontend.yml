name: deploy-frontend

on:
  push:
    branches:
      - master
    paths:
      - "app/web/**"
      - ".github/workflows/app-frontend.yml"
  workflow_dispatch:

concurrency:
  group: app-frontend
  cancel-in-progress: true # last push wins;

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  BUCKET: ${{ vars.S3_BUCKET }}
  KMS_ALIAS: ${{ vars.KMS_ALIAS }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload
        run: |
          key=$(aws kms describe-key --key-id "alias/$KMS_ALIAS" --query 'KeyMetadata.Arn' --output text)
          aws s3 sync app/web/ "s3://$BUCKET/web/" \
            --delete \
            --sse aws:kms \
            --sse-kms-key-id "$key" \
            --content-type "text/html; charset=utf-8" \
            --exclude "*" --include "*.html"

      - name: Invalidate to remove outdate web files from cloudfront
        run: |
          dist=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[0]=='${{ vars.DOMAIN_NAME }}'].Id | [0]" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$dist" --paths '/*' >/dev/null
          echo "invalidated $dist"

      - name: Smoke test
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://${{ vars.DOMAIN_NAME }}/")
          echo "GET / -> $code"
          test "$code" = "200"
