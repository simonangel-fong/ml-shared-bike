services:
  jupyter:
    container_name: ml-jupyter
    build:
      context: .
      dockerfile: Dockerfile
    image: ml-jupyter
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
      # same network, so the server is reachable by service name
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      # read-only: the export is the warehouse's output
      - ../data/export:/opt/data/export:ro
      - ./data:/opt/data/ml
    networks:
      - ml-net
    depends_on:
      mlflow:
        condition: service_healthy

  postgres:
    container_name: ml-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ml-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mlflow:
    container_name: ml-mlflow
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: ml-mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      # artifacts are proxied through the server, so only it needs this path
      - ./artifacts:/mlflow/artifacts
    networks:
      - ml-net
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  ml-net:
    driver: bridge
