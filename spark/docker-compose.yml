x-worker: &worker
  image: apache/spark:3.5.0
  restart: unless-stopped
  environment:
    SPARK_NO_DAEMONIZE: "true"
  volumes:
    - ../data:/opt/data
    - ./jobs:/opt/jobs
  networks:
    - spark-net
  healthcheck:
    test:
      - CMD-SHELL
      - curl -sf http://spark-master:8080/json/ | grep -Eq "\"host\"\s*:\s*\"$(hostname -i)\""
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s
  depends_on:
    spark-master:
      condition: service_healthy

services:
  spark-master:
    container_name: spark-master
    image: apache/spark:3.5.0
    restart: unless-stopped
    networks:
      - spark-net
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ../data:/opt/data
      - ./jobs:/opt/jobs
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 2 bash -c 'echo > /dev/tcp/spark-master/7077'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  spark-worker-1:
    <<: *worker
    container_name: spark-worker-1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores ${SPARK_WORKER_CORES:-2}
      --memory ${SPARK_WORKER_MEMORY:-2G}
      --webui-port 8081
    ports:
      - "8081:8081"

  spark-worker-2:
    <<: *worker
    container_name: spark-worker-2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores ${SPARK_WORKER_CORES:-2}
      --memory ${SPARK_WORKER_MEMORY:-2G}
      --webui-port 8081
    ports:
      - "8082:8081"

  spark-worker-3:
    <<: *worker
    container_name: spark-worker-3
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores ${SPARK_WORKER_CORES:-2}
      --memory ${SPARK_WORKER_MEMORY:-2G}
      --webui-port 8081
    ports:
      - "8084:8081"

  jupyter:
    container_name: spark-jupyter
    build:
      context: ./jupyter
      dockerfile: Dockerfile.jupyter
    image: spark-jupyter
    hostname: spark-jupyter
    user: root
    environment:
      NB_UID: "185"
      NB_GID: "185"
      CHOWN_EXTRA: "/opt/data"
      CHOWN_EXTRA_OPTS: "-R"
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
    ports:
      - "8888:8888"
      - "4040:4040"
      - "7078:7078"
      - "7079:7079"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ../data:/opt/data
    networks:
      - spark-net
    depends_on:
      spark-master:
        condition: service_healthy

networks:
  spark-net:
    driver: bridge
