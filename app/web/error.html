<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Toronto Shared Bike MLOps</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/img/logo-bike-32.png">

  <!-- Belt and braces: the meta refresh still fires if the script is blocked. -->
  <meta http-equiv="refresh" content="15; url=/">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Root-relative: this page is served for any depth of missing path, so a
       relative href would resolve against the wrong directory. -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <main class="error-wrap">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">

          <p class="error-code mb-2">404</p>
          <h1 class="h3 mb-3">This page does not exist</h1>

          <p class="text-secondary mb-4">
            The page you asked for is not part of this site.
            Returning to the home page in <span id="count">15</span> seconds.
          </p>

          <a href="/" class="btn btn-primary px-4">Go back now</a>

        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var el = document.getElementById("count");
      var left = 15;

      setInterval(function () {
        left -= 1;
        if (left <= 0) {
          window.location.replace("/");
          return;
        }
        el.textContent = left;
      }, 1000);
    })();
  </script>
</body>

</html>
