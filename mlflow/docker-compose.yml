# MLflow tracking stack — independent of spark/docker-compose.yml.
# Backend store: Postgres. Artifact store: ./artifacts, bind-mounted from the host.
services:
  postgres:
    container_name: mlflow-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mlflow-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mlflow:
    container_name: mlflow-server
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: mlflow-server
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      # Artifacts are proxied through the server (--serve-artifacts), so the
      # training client never needs this path — only the container does.
      - ./artifacts:/mlflow/artifacts
    networks:
      - mlflow-net
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  mlflow-net:
    driver: bridge
